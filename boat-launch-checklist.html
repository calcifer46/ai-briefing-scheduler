<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Boat Launch Checklist – 2017 Tracker Grizzly 1648</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --grn:    #2b4f12;
  --grn-md: #3d6b1a;
  --grn-lt: #e8eee2;
  --tan:    #8b6914;
  --tan-lt: #f5edd8;
  --khaki:  #ddd5bc;
  --card:   #f5f0e4;
  --border: #c4b896;
  --text:   #1c1408;
  --muted:  #6b5d42;
  --crit:   #c94a0a;
  --crit-lt:#fdf0e8;
  --warn:   #8b6914;
  --warn-lt:#fdf5dc;
  --check:  #3d6b1a;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background: var(--khaki);
  color: var(--text);
  min-height:100vh;
  padding:14px;
}

/* ── HEADER ── */
header {
  border-radius:12px;
  padding:20px 22px 16px;
  margin-bottom:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.3);
  position:relative;
  overflow:hidden;
  background-color: var(--grn);
  background-image:
    radial-gradient(ellipse 80px 55px at  8% 20%, #1a3009 0%, transparent 100%),
    radial-gradient(ellipse 65px 80px at 28% 65%, #4a7a25 0%, transparent 100%),
    radial-gradient(ellipse 90px 50px at 55% 15%, #1e3d0a 0%, transparent 100%),
    radial-gradient(ellipse 70px 90px at 72% 70%, #1a3009 0%, transparent 100%),
    radial-gradient(ellipse 55px 65px at 90% 35%, #4a7a25 0%, transparent 100%),
    radial-gradient(ellipse 60px 40px at 40% 90%, #1e3d0a 0%, transparent 100%);
}
header::before {
  content:'';
  position:absolute;inset:0;
  background:rgba(0,0,0,.15);
  pointer-events:none;
}
header h1 { font-size:1.35rem; font-weight:800; color:#fff; position:relative; text-shadow:0 1px 3px rgba(0,0,0,.4); }
header p  { font-size:.82rem; color:rgba(255,255,255,.82); margin-top:5px; position:relative; }

.logo-bar {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.logo-badge {
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  border-radius:6px;
  padding:3px 10px;
  font-size:.72rem;
  font-weight:700;
  color:rgba(255,255,255,.9);
  text-transform:uppercase;
  letter-spacing:.8px;
}

.pb-wrap {
  background:rgba(0,0,0,.25);
  border-radius:99px;
  height:8px;
  margin-top:14px;
  overflow:hidden;
  position:relative;
}
.pb {
  background:linear-gradient(90deg,#8bc34a,#c8e6a0);
  height:100%;
  border-radius:99px;
  width:0%;
  transition:width .4s ease;
}
.pl { font-size:.76rem; color:rgba(255,255,255,.8); margin-top:6px; position:relative; }

/* ── CONTROLS ── */
.controls {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
button {
  cursor:pointer;
  border:none;
  border-radius:8px;
  padding:9px 16px;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.2px;
  transition:filter .15s, box-shadow .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
button:hover { filter:brightness(.92); }
.btn-reset  { background:#e5ddc8; color:var(--text); }
.btn-print  { background:var(--grn); color:#fff; }
.btn-edit   { background:var(--tan); color:#fff; }
.btn-edit.active { background:#c94a0a; }

/* ── SECTIONS ── */
section {
  background:var(--card);
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 1px 5px rgba(0,0,0,.12);
  overflow:hidden;
  border:1px solid var(--border);
}

.sh {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
}
.si { font-size:1.2rem; }
.st { font-size:.95rem; font-weight:800; flex:1; color:var(--text); }
.sc {
  font-size:.74rem;
  font-weight:700;
  background:rgba(0,0,0,.08);
  border-radius:99px;
  padding:2px 9px;
  color:var(--muted);
}

.h1 .sh { background:#dce8d0; border-bottom-color:#c0d4b0; }
.h2 .sh { background:#ede5cc; border-bottom-color:#d8c89a; }
.h3 .sh { background:#d0e0d0; border-bottom-color:#b4ccb4; }
.h4 .sh { background:#d8e8d4; border-bottom-color:#bcd4b8; }
.h5 .sh { background:#e8e0cc; border-bottom-color:#d0c4a4; }
.h6 .sh { background:#d8e4d0; border-bottom-color:#bcceb8; }

/* ── LIST ITEMS ── */
ul { list-style:none; }

li {
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px 16px;
  border-bottom:1px solid #e8e0cc;
  transition:background .1s;
  position:relative;
}
li:last-child { border-bottom:none; }
li:hover:not(.add-row) { background:#ede8d8; }
li.done { opacity:.45; }
li.done .il { text-decoration:line-through; }

input[type=checkbox] {
  width:20px;
  height:20px;
  min-width:20px;
  cursor:pointer;
  accent-color:var(--check);
  margin-top:2px;
}

.ib { flex:1; min-width:0; }
.il {
  font-size:.88rem;
  font-weight:600;
  line-height:1.4;
  color:var(--text);
}
.in {
  font-size:.76rem;
  color:var(--muted);
  margin-top:3px;
  line-height:1.45;
}

/* badges */
.badge {
  display:inline-block;
  font-size:.64rem;
  font-weight:800;
  border-radius:4px;
  padding:1px 6px;
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-left:6px;
  vertical-align:middle;
}
.bc { background:var(--crit-lt); color:var(--crit); border:1px solid #f5c6a0; }
.bw { background:var(--warn-lt); color:var(--warn); border:1px solid #e8d08a; }

li.crit { border-left:3px solid var(--crit); }
li.crit .il { color:var(--crit); }

/* ── EDIT MODE ── */
.del-btn {
  display:none;
  background:#c94a0a;
  color:#fff;
  border:none;
  border-radius:50%;
  width:22px;
  height:22px;
  min-width:22px;
  font-size:.85rem;
  line-height:1;
  cursor:pointer;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:none;
  margin-top:1px;
  flex-shrink:0;
}
.crit-toggle {
  display:none;
  background:none;
  border:1px solid var(--border);
  border-radius:5px;
  font-size:.65rem;
  font-weight:700;
  padding:2px 5px;
  cursor:pointer;
  color:var(--muted);
  box-shadow:none;
  margin-top:1px;
  white-space:nowrap;
  flex-shrink:0;
}
.crit-toggle:hover { background:var(--crit-lt); color:var(--crit); }

body.edit-mode .del-btn       { display:flex; }
body.edit-mode .crit-toggle   { display:block; }
body.edit-mode .il[contenteditable],
body.edit-mode .in[contenteditable] {
  outline:1px dashed var(--tan);
  border-radius:3px;
  padding:1px 3px;
  background:rgba(255,255,255,.6);
  cursor:text;
}

.add-row {
  padding:8px 16px;
  cursor:pointer;
  display:none;
  align-items:center;
  gap:8px;
  color:var(--grn-md);
  font-size:.82rem;
  font-weight:700;
  border-top:1px dashed var(--border);
}
.add-row:hover { background:#dce8d0; }
body.edit-mode .add-row { display:flex; }

/* hide add-row during normal view */
li.add-row input { display:none; }

/* ── FOOTER ── */
footer {
  text-align:center;
  font-size:.74rem;
  color:var(--muted);
  padding:10px 0 28px;
}
footer strong { color:var(--grn); }

@media print {
  body { background:#fff; padding:8px; }
  .controls,.pb-wrap,.pl { display:none; }
  section { box-shadow:none; border:1px solid #ccc; page-break-inside:avoid; }
  .del-btn,.crit-toggle,.add-row { display:none !important; }
  li.done { opacity:1; }
  li.done .il { text-decoration:none; }
}
</style>
</head>
<body>

<header>
  <div class="logo-bar">
    <span class="logo-badge">Tracker</span>
    <span class="logo-badge">Grizzly 1648</span>
    <span class="logo-badge">Mercury 25hp 4-Stroke</span>
  </div>
  <h1>⛵ Boat Launch Checklist</h1>
  <p>2017 Tracker Grizzly 1648 &nbsp;·&nbsp; Mercury 25hp 4-Stroke Tiller Outboard</p>

<div class="controls">
  <button class="btn-reset" onclick="resetAll()">&#8635; Reset All</button>

  <button class="btn-edit" id="editBtn" onclick="toggleEdit()">&#9998; Edit Checklist</button>

<div id="sections"></div>

<footer><strong>Tracker Grizzly 1648</strong> &nbsp;·&nbsp; Mercury 25hp 4-Stroke Tiller &nbsp;·&nbsp; Have a safe trip! ⛵</footer>

<script>
// ══════════════════════════════════════════════
//  DEFAULT SECTIONS DATA
// ══════════════════════════════════════════════

      {id:'1n', label:'Verify all tie-down straps are secure', note:'Bow strap to winch, stern transom straps. Bow safety chain if present.', crit:false},

      {id:'1p', label:'Locate the drain plug', note:'Know where it is BEFORE you leave. Keep a spare in the truck glovebox.', crit:true},

  {
    id:'s2', icon:'🚗', title:'Phase 2 — At the Ramp (Before Backing In)', cls:'h2',
    items:[
      {id:'2a', label:'Pull into the staging area — not the ramp lane', note:'Do all prep here so you\'re not blocking others while working on the boat.', crit:false},
      {id:'2b', label:'Install the drain plug', note:'The #1 beginner mistake. Reach under the transom and thread it in firmly. Check it twice.', crit:true},
      {id:'2c', label:'Remove motor cover / engine cover (if any)', note:'Remove any canvas or tarp covering the motor before launch.', crit:false},
      {id:'2d', label:'Put motor in forward gear, then tilt motor down', note:'The motor must be in forward gear to release the tilt tension and trim it down. Then shift back to neutral before starting.', crit:false},
      {id:'2e', label:'Remove transom saver', note:'Stow the transom saver in the truck before backing down.', crit:false},
      {id:'2f', label:'Disconnect trailer lights plug', note:'Dunking hot trailer lights causes bulb failure and corrosion. Unplug before wheels enter the water.', crit:false},
      {id:'2g', label:'Remove stern tie-down straps', note:'Remove both rear straps now. Leave the bow winch strap on until the boat is floating.', crit:false},

    items:[
      {id:'3a', label:'Back trailer slowly down the ramp', note:'Go slow. Stop before the tow vehicle\'s rear tires enter the water if possible.', crit:false},

    ]
  },
  {
    id:'s4', icon:'🌊', title:'Phase 4 — On the Water (Periodic Checks)', cls:'h4',
    items:[
      {id:'4a', label:'Observe no-wake zone & speed limits', note:'Most ramp areas enforce idle speed within 100–200 ft of shore or marked buoys.', crit:false},
      {id:'4b', label:'Re-check tell-tale stream after 5 minutes', note:'Confirm cooling water is still flowing once up on plane.', crit:false},
      {id:'4c', label:'Scan bilge every 30–60 minutes', note:'Aluminum boats can flex; rivet leaks are possible.', crit:false},
      {id:'4d', label:'Monitor fuel — rule of thirds', note:'Start heading back when you\'ve used ~1/3 of your fuel.', crit:false},
      {id:'4e', label:'Watch weather — head in if storm threatens', note:'Lightning on open water is extremely dangerous. Head to shore early.', crit:false},
    ]

  {
    id:'s5', icon:'🔄', title:'Phase 5 — Loading / Retrieving at the Ramp', cls:'h5',
    items:[
      {id:'5a', label:'Idle into the dock / loading area slowly', note:'Come in at low speed, into the wind or current if possible.', crit:false},

// ══════════════════════════════════════════════
//  STATE & STORAGE
// ══════════════════════════════════════════════
const LS_CHECK  = 'grizzly_checks';
const LS_CUSTOM = 'grizzly_custom';

function loadChecks() {
  try { return JSON.parse(localStorage.getItem(LS_CHECK) || '{}'); } catch(e) { return {}; }
}
function saveChecks(c) { localStorage.setItem(LS_CHECK, JSON.stringify(c)); }

function loadCustom() {
  try { return JSON.parse(localStorage.getItem(LS_CUSTOM) || 'null'); } catch(e) { return null; }
}
function saveCustom(s) { localStorage.setItem(LS_CUSTOM, JSON.stringify(s)); }

function getSections() {
  const custom = loadCustom();
  if (custom) return custom;
  return JSON.parse(JSON.stringify(DEFAULTS));
}

let sections = getSections();
let checks   = loadChecks();
let editMode = false;

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';

  sections.forEach(sec => {
    const sEl = document.createElement('section');
    sEl.className = sec.cls;
    sEl.dataset.sid = sec.id;

    // count
    const total   = sec.items.length;
    const checked = sec.items.filter(it => checks[it.id]).length;

    sEl.innerHTML = `
      <div class="sh">
        <span class="si">${sec.icon}</span>
        <span class="st" id="title-${sec.id}">${escH(sec.title)}</span>
        <span class="sc" id="cnt-${sec.id}">${checked} / ${total}</span>
      </div>`;

    const ul = document.createElement('ul');

    sec.items.forEach(item => {
      const li = document.createElement('li');
      li.className = item.crit ? 'crit' : '';
      li.dataset.iid = item.id;
      li.dataset.sid = sec.id;

      li.innerHTML = `
        <input type="checkbox" ${checks[item.id] ? 'checked' : ''}/>
        <div class="ib">
          <div class="il" ${editMode ? 'contenteditable="true"' : ''}>${escH(item.label)}${item.crit ? ' <span class="badge bc">Critical</span>' : ''}</div>
          <div class="in" ${editMode ? 'contenteditable="true"' : ''}>${escH(item.note)}</div>
        </div>
        <button class="crit-toggle" title="Toggle critical">${item.crit ? '★ Critical' : '☆ Critical'}</button>
        <button class="del-btn" title="Delete item">×</button>`;

      // checkbox
      li.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) { checks[item.id] = true; li.classList.add('done'); }
        else                  { delete checks[item.id]; li.classList.remove('done'); }
        if (checks[item.id] === undefined) delete checks[item.id];
        saveChecks(checks);
        updateProgress();
        document.getElementById('cnt-' + sec.id).textContent =
          sec.items.filter(i => checks[i.id]).length + ' / ' + sec.items.length;
      });
      if (checks[item.id]) li.classList.add('done');

      // delete
      li.querySelector('.del-btn').addEventListener('click', () => {
        if (!confirm('Delete this item?')) return;
        sec.items = sec.items.filter(i => i.id !== item.id);
        delete checks[item.id];
        saveChecks(checks);
        saveCustom(sections);
        render();
      });

      // critical toggle
      li.querySelector('.crit-toggle').addEventListener('click', () => {
        item.crit = !item.crit;
        saveCustom(sections);
        render();
      });

      // inline edit — save on blur
      ['il','in'].forEach(cls => {
        const el = li.querySelector('.' + cls);
        if (!el) return;
        el.addEventListener('blur', () => {
          // strip badge html before saving
          const raw = el.innerText.replace(/\s*critical\s*/gi,'').trim();
          if (cls === 'il') item.label = raw;
          else              item.note  = raw;
          saveCustom(sections);
        });
        // prevent checkbox toggling when clicking editable area
        el.addEventListener('click', e => { if (editMode) e.stopPropagation(); });
      });

      ul.appendChild(li);
    });

    // Add item row
    const addLi = document.createElement('li');
    addLi.className = 'add-row';
    addLi.innerHTML = '&#43; Add item';
    addLi.addEventListener('click', () => {
      const label = prompt('New item name:');
      if (!label || !label.trim()) return;
      const note = prompt('Short note (optional):') || '';
      const newId = sec.id + '_c' + Date.now();
      sec.items.push({ id: newId, label: label.trim(), note: note.trim(), crit: false });
      saveCustom(sections);
      render();
    });
    ul.appendChild(addLi);

    sEl.appendChild(ul);
    container.appendChild(sEl);
  });

  updateProgress();
}

function escH(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════
//  PROGRESS
// ══════════════════════════════════════════════
function updateProgress() {
  let total = 0, done = 0;
  sections.forEach(sec => {
    total += sec.items.length;
    done  += sec.items.filter(i => checks[i.id]).length;
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('pl').textContent = done + ' of ' + total + ' items complete';
}

// ══════════════════════════════════════════════
//  CONTROLS
// ══════════════════════════════════════════════
function resetAll() {
  if (!confirm('Reset all checkboxes for a new trip?')) return;
  checks = {};
  saveChecks(checks);
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  document.querySelectorAll('li.done').forEach(li => li.classList.remove('done'));
  updateProgress();
  sections.forEach(sec => {
    const el = document.getElementById('cnt-' + sec.id);
    if (el) el.textContent = '0 / ' + sec.items.length;
  });
}

function toggleEdit() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✓ Done Editing' : '✎ Edit Checklist';
  btn.classList.toggle('active', editMode);
  if (!editMode) render(); // re-render to clean up contenteditable
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
render();
</script>
</body>
</html>
